version: '3'

vars:
  APP_NAME: "Private DNS for Cloudflare"
  BIN_NAME: "cf-priv-dns"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: "bun"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  BINDINGS_DIR: "./frontend/src/gen/bindings"
  APP_VERSION:
    sh: git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0"
  APP_COMMIT_HASH:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "abcdef1234567890"
  APP_BUILD_TIMESTAMP:
    sh: date -u '+%Y-%m-%dT%H:%M:%SZ'
  # Linked into every go build of the platform Taskfiles (and the Docker cross
  # build via EXTRA_LDFLAGS). No quotes around the values: BUILD_FLAGS also ends
  # up inside a single-quoted shell argument in common:generate:bindings.
  LDFLAGS: "-X main.Version={{.APP_VERSION}} -X main.CommitHash={{.APP_COMMIT_HASH}} -X main.BuildTimestamp={{.APP_BUILD_TIMESTAMP}}"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  clean:
    summary: Delete build directories
    cmds:
      - cmd: rm -rf bin

  build:
    summary: Builds the application
    deps:
      - task: bindings
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - cmd: wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  bindings:
    summary: Generate wails bindings
    sources:
      - "**/*.go"
    generates:
      - "{{.BINDINGS_DIR}}"
    cmd: wails3 generate bindings -d "{{.BINDINGS_DIR}}" -ts
